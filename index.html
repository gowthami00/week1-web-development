
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="weather-card">
        <h1>Weather App</h1>
        <p class="subtitle">Check the weather in your city</p>

        <div class="search-box">
            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name"
            >
            <button id="searchBtn">Search</button>
        </div>

        <p id="message"></p>

        <div id="weatherInfo" class="weather-info hidden">
            <h2 id="cityName">City</h2>
            <p id="weatherIcon">🌤️</p>
            <h3 id="temperature">--°C</h3>
            <p id="condition">Weather condition</p>

            <div class="details">
                <div class="detail-box">
                    <p>Humidity</p>
                    <h3 id="humidity">--%</h3>
                </div>

                <div class="detail-box">
                    <p>Feels Like</p>
                    <h3 id="feelsLike">--°C</h3>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
